<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAS PBO - Aplikasi Login</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }
        h2 { margin-bottom: 25px; color: #333; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }
        /* Ketentuan Warna UX UAS: Login Biru/Hijau, Logout Merah */
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 10px;
            transition: 0.3s;
        }
        .btn-login { background-color: #007bff; color: white; } /* Biru Positif */
        .btn-logout { background-color: #dc3545; color: white; } /* Merah */
        .btn-cancel { background-color: #ffcc00; color: black; }
        .btn:hover { opacity: 0.8; }
        .hidden { display: none; }
        #msg-profile { color: #007bff; font-weight: bold; font-size: 1.1em; }
    </style>
</head>
<body>

    <div class="login-box">
        <div id="view-login">
            <h2>Login</h2>
            <input type="text" id="user-field" placeholder="Username">
            <input type="password" id="pass-field" placeholder="Password">
            <button class="btn btn-login" onclick="appAuth.prosesLogin()">Log In</button>
            <button class="btn btn-cancel" onclick="appAuth.bersihkanForm()">Cancel</button>
        </div>

        <div id="view-profile" class="hidden">
            <h2>Halaman Profil</h2>
            <p id="msg-profile"></p>
            <button class="btn btn-logout" onclick="appAuth.prosesLogout()">Log Out</button>
        </div>
    </div>

    <script>
        /**
         * PENERAPAN KONSEP OOP (WAJIB UAS)
         * Menggunakan Class, Constructor, Object, dan Method
         */
        class LoginSystem {
            constructor() {
                // Key untuk LocalStorage (Simulasi File I/O)
                this.storageKey = 'status_login'; 
                // Data User sesuai contoh soal
                this.dataUser = [
                    { nama: "vera", sandi: "vera123" },
                    { nama: "asta", sandi: "asta456" }
                ];
                this.checkSession();
            }

            // Method untuk proses login
            prosesLogin() {
                const u = document.getElementById('user-field').value;
                const p = document.getElementById('pass-field').value;
                
                const ditemukan = this.dataUser.find(user => 
                    user.nama.toLowerCase() === u.toLowerCase() && user.sandi === p
                );

                if (ditemukan) {
                    // Simpan status login di LocalStorage
                    localStorage.setItem(this.storageKey, JSON.stringify(ditemukan));
                    this.tampilkanHalamanProfil(ditemukan.nama);
                } else {
                    // Pesan Gagal Login menggunakan Alert sesuai soal
                    [cite_start]alert("mohon maaf, kamu gagal login."); [cite: 38]
                }
            }

            // Method untuk logout
            prosesLogout() {
                [cite_start]localStorage.removeItem(this.storageKey); [cite: 44]
                [cite_start]location.reload(); [cite: 45]
            }

            // Method untuk cek status login di LocalStorage
            checkSession() {
                [cite_start]const session = localStorage.getItem(this.storageKey); [cite: 18]
                if (session) {
                    const user = JSON.parse(session);
                    this.tampilkanHalamanProfil(user.nama);
                }
            }

            // Method untuk manipulasi DOM profil
            tampilkanHalamanProfil(username) {
                document.getElementById('view-login').classList.add('hidden');
                document.getElementById('view-profile').classList.remove('hidden');
                [cite_start]document.getElementById('msg-profile').innerText = `Selamat Datang, ${username}!`; [cite: 42]
            }

            bersihkanForm() {
                document.getElementById('user-field').value = '';
                document.getElementById('pass-field').value = '';
            }
        }

        // Instansiasi Objek (Object)
        [cite_start]const appAuth = new LoginSystem(); [cite: 28]
    </script>
</body>
</html>
