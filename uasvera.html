<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAS PBO - Future Auth</title>
    <style>
        :root {
            --primary: #00d2ff; /* Warna biru neon */
            --accent: #facc15;  /* Warna kuning untuk tombol reset */
            --bg-dark: #0f172a;
            --card-bg: rgba(15, 23, 42, 0.8);
            --glass-border: rgba(0, 210, 255, 0.2);
            --text-main: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #020617;
            background-image: 
                radial-gradient(circle at 50% 50%, #1e293b 0%, #020617 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            overflow: hidden;
        }

        /* Dekorasi Garis Sudut (Corner Brackets) */
        .container::before, .container::after {
            content: "";
            position: absolute;
            width: 30px;
            height: 30px;
            z-index: 11;
        }
        .container::before {
            top: 10px; left: 10px;
            border-top: 3px solid var(--glass-border);
            border-left: 3px solid var(--glass-border);
        }
        .container::after {
            bottom: 10px; right: 10px;
            border-bottom: 3px solid var(--primary);
            border-right: 3px solid var(--primary);
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 400px;
            padding: 3rem 2rem;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            text-align: center;
        }

        h2 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            font-weight: 900;
        }

        .subtitle {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 2.5rem;
        }

        /* Input Styling - Gelap sesuai gambar */
        .input-group { margin-bottom: 1rem; }
        
        input {
            width: 100%;
            padding: 15px;
            background: #1e293b;
            border: 1px solid transparent;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        /* Tombol Miring (Parallelogram) sesuai gambar */
        .btn-wrapper {
            overflow: hidden;
            margin-top: 1.5rem;
            transform: skewX(-15deg); /* Membuat bentuk miring */
            border-radius: 4px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            cursor: pointer;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            transform: skewX(15deg); /* Mengembalikan teks agar tidak miring */
        }

        .btn-login {
            background: #1e293b;
            color: white;
            border: 1px solid var(--primary);
        }

        .btn-login:hover {
            background: var(--primary);
            color: #0f172a;
        }

        .btn-reset {
            background: var(--accent);
            color: #0f172a;
            margin-top: 10px;
        }

        .btn-reset:hover {
            filter: brightness(1.1);
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div id="login-view">
            <h2>LOGIN SYSTEM</h2>
            <p class="subtitle">Future OOP Authentication</p>
            
            <div class="input-group">
                <input type="text" id="user-input" placeholder="USERNAME" autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" id="pass-input" placeholder="PASSWORD">
            </div>
            
            <div class="btn-wrapper">
                <button class="btn btn-login" onclick="authApp.login()">ACCESS SYSTEM</button>
            </div>
            <div class="btn-wrapper">
                <button class="btn btn-reset" onclick="authApp.clear()">RESET</button>
            </div>
        </div>

        <div id="profile-view" class="hidden">
            <h2>AUTHORIZED</h2>
            <p class="subtitle">Access Granted</p>
            <div id="profile-info" style="margin: 20px 0; font-weight: bold; color: var(--primary);"></div>
            <div class="btn-wrapper">
                <button class="btn btn-login" style="border-color: #ef4444; color: #ef4444;" onclick="authApp.logout()">TERMINATE SESSION</button>
            </div>
        </div>
    </div>

    <script>
        class AuthSystem {
            constructor() {
                this.sessionKey = 'user_session';
                this.users = [
                    { nama: "vera", sandi: "vera123" },
                    { nama: "asta", sandi: "asta456" },
                    { nama: "rena", sandi: "rena789" }
                ];
                this.checkSession();
            }

            login() {
                const uInput = document.getElementById('user-input').value.trim();
                const pInput = document.getElementById('pass-input').value;
                const user = this.users.find(x => x.nama.toLowerCase() === uInput.toLowerCase() && x.sandi === pInput);

                if (user) {
                    localStorage.setItem(this.sessionKey, JSON.stringify(user));
                    this.showDashboard(user.nama);
                } else {
                    alert("ACCESS DENIED: INVALID CREDENTIALS");
                }
            }

            logout() {
                localStorage.removeItem(this.sessionKey);
                location.reload();
            }

            checkSession() {
                const session = localStorage.getItem(this.sessionKey);
                if (session) {
                    const userData = JSON.parse(session);
                    this.showDashboard(userData.nama);
                }
            }

            showDashboard(name) {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('profile-view').classList.remove('hidden');
                document.getElementById('profile-info').innerText = `WELCOME, ${name.toUpperCase()}`;
            }

            clear() {
                document.getElementById('user-input').value = '';
                document.getElementById('pass-input').value = '';
                document.getElementById('user-input').focus();
            }
        }
        const authApp = new AuthSystem();
    </script>
</body>
</html>
