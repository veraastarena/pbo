<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAS PBO - Future Login System</title>
    <style>
        :root {
            --primary-purple: #8a2be2; /* Warna Ungu Login */
            --danger-red: #ff4b2b;    /* Warna Merah Cancel */
            --bg-dark: #060b23;
            --accent-cyan: #00f2ff;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-dark);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .orb {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
        }
        .orb-1 { background: rgba(138, 43, 226, 0.2); top: -10%; left: -10%; }
        .orb-2 { background: rgba(0, 242, 255, 0.1); bottom: -10%; right: -10%; }

        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            width: 380px;
            text-align: center;
        }

        h2 { color: #fff; margin-bottom: 30px; letter-spacing: 3px; text-transform: uppercase; }
        
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            background: #eef2f7;
            border: none;
            border-radius: 12px;
            color: #333;
            box-sizing: border-box;
            outline: none;
            font-size: 16px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .btn-login { background: var(--primary-purple); color: #fff; }
        .btn-cancel { background: var(--danger-red); color: #fff; }
        .btn-logout { background: transparent; border: 1px solid #555; color: #fff; }

        .btn:hover { opacity: 0.9; transform: scale(1.02); }
        .hidden { display: none; }
        #profile-info { color: var(--accent-cyan); font-size: 1.3em; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="container">
        <div id="login-view">
            <h2>SELAMAT DATANG</h2>
            <input type="text" id="user-input" placeholder="Username">
            <input type="password" id="pass-input" placeholder="Password">
            <button class="btn btn-login" onclick="authApp.login()">Log In</button>
            <button class="btn btn-cancel" onclick="authApp.clear()">Cancel</button>
        </div>

        <div id="profile-view" class="hidden">
            <h2>PROFIL</h2>
            <div id="profile-info"></div>
            <button class="btn btn-logout" onclick="authApp.logout()">Log Out</button>
        </div>
    </div>

    <script>
        class AuthSystem {
            constructor() {
                this.sessionKey = 'user_session';
                const storedUsers = localStorage.getItem('database_pengguna');
                
                // Daftar user termasuk rena (rena789)
                this.users = storedUsers ? JSON.parse(storedUsers) : [
                    { nama: "vera", sandi: "vera123" },
                    { nama: "asta", sandi: "asta456" },
                    { nama: "rena", sandi: "rena789" }
                ];
                this.checkSession();
            }

            login() {
                const uInput = document.getElementById('user-input').value.trim();
                const pInput = document.getElementById('pass-input').value;

                const user = this.users.find(x => x.nama.toLowerCase() === uInput.toLowerCase() && x.sandi === pInput);

                if (user) {
                    alert(`Hi, ${user.nama} selamat anda berhasil login.`);
                    localStorage.setItem(this.sessionKey, JSON.stringify(user));
                    this.showDashboard(user.nama);
                } else {
                    const displayName = uInput ? uInput : "User";
                    alert(`Mohon maaf ${displayName} anda gagal login.`);
                }
            }

            logout() {
                localStorage.removeItem(this.sessionKey);
                location.reload();
            }

            checkSession() {
                const session = localStorage.getItem(this.sessionKey);
                if (session) {
                    const userData = JSON.parse(session);
                    this.showDashboard(userData.nama);
                }
            }

            showDashboard(name) {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('profile-view').classList.remove('hidden');
                document.getElementById('profile-info').innerText = `Selamat Datang, ${name}`;
            }

            clear() {
                document.getElementById('user-input').value = '';
                document.getElementById('pass-input').value = '';
            }
        }

        const authApp = new AuthSystem();
    </script>
</body>
</html>
