<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAS PBO - Secure Auth System</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.5);
            --bg-dark: #080c14;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            background-color: var(--bg-dark);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
        }

        /* --- BACKGROUND ANIMATION --- */
        .bg-wrapper {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #080c14 100%);
        }

        .blob {
            position: absolute;
            width: 500px; height: 500px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(168, 85, 247, 0.2) 100%);
            filter: blur(80px);
            border-radius: 50%;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-10%, -10%) rotate(0deg); }
            to { transform: translate(20%, 20%) rotate(360deg); }
        }

        .grid-overlay {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(ellipse at center, black, transparent 80%);
        }

        /* --- CARD CONTAINER --- */
        .container {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            z-index: 10;
        }

        header { text-align: center; margin-bottom: 2.5rem; }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 0.75rem;
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.3);
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
            font-weight: 700;
        }

        h2 {
            font-size: 1.75rem;
            font-weight: 800;
            background: linear-gradient(to bottom, #fff 30%, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        /* --- INPUTS --- */
        .input-group { margin-bottom: 1.5rem; }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 0.5rem;
            margin-left: 0.5rem;
        }

        input {
            width: 100%;
            padding: 14px 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 20px var(--primary-glow);
            transform: scale(1.02);
        }

        /* --- BUTTONS --- */
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            margin-top: 0.5rem;
        }

        .btn-login {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.5);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(79, 70, 229, 0.6);
            filter: brightness(1.1);
        }

        .btn-cancel {
            background: transparent;
            color: var(--text-dim);
            margin-top: 1rem;
        }

        .btn-cancel:hover { color: #ef4444; }

        .hidden { display: none; }
        
        #profile-info {
            padding: 1.5rem;
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            border: 1px dashed var(--glass-border);
            text-align: center;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>

    <div class="bg-wrapper">
        <div class="blob"></div>
        <div class="grid-overlay"></div>
    </div>

    <div class="container">
        <div id="login-view">
            <header>
                <span class="badge">SECURE TERMINAL V2.0</span>
                <h2>Login System</h2>
                <p style="color: var(--text-dim); font-size: 0.9rem;">Masukkan akses kredensial anda</p>
            </header>
            
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="user-input" placeholder="ex: vera" autocomplete="off">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="pass-input" placeholder="••••••••">
            </div>
            
            <button class="btn btn-login" onclick="authApp.login()">Akses Sistem</button>
            <button class="btn btn-cancel" onclick="authApp.clear()">Reset</button>
        </div>

        <div id="profile-view" class="hidden">
            <header>
                <div class="badge" style="background: rgba(34, 197, 94, 0.1); color: #4ade80; border-color: rgba(34,197,94,0.3)">AUTHENTICATED</div>
                <h2>Selamat Datang</h2>
            </header>
            <div id="profile-info"></div>
            <button class="btn btn-login" style="background: #ef4444;" onclick="authApp.logout()">Keluar Sesi</button>
        </div>
    </div>

    <script>
        // Gunakan script logic yang Anda miliki sebelumnya di sini
        // Pastikan untuk menyesuaikan pemanggilan ID jika ada yang diubah
        class AuthSystem {
            constructor() {
                this.sessionKey = 'user_session';
                this.users = [
                    { nama: "vera", sandi: "vera123" },
                    { nama: "asta", sandi: "asta456" },
                    { nama: "rena", sandi: "rena789" }
                ];
                this.checkSession();
            }

            login() {
                const uInput = document.getElementById('user-input').value.trim();
                const pInput = document.getElementById('pass-input').value;
                const user = this.users.find(x => x.nama.toLowerCase() === uInput.toLowerCase() && x.sandi === pInput);

                if (user) {
                    localStorage.setItem(this.sessionKey, JSON.stringify(user));
                    this.showDashboard(user.nama);
                } else {
                    alert("Akses Ditolak: Kredensial tidak valid.");
                }
            }

            logout() {
                localStorage.removeItem(this.sessionKey);
                location.reload();
            }

            checkSession() {
                const session = localStorage.getItem(this.sessionKey);
                if (session) {
                    const userData = JSON.parse(session);
                    this.showDashboard(userData.nama);
                }
            }

            showDashboard(name) {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('profile-view').classList.remove('hidden');
                document.getElementById('profile-info').innerHTML = `Log masuk sebagai:<br><strong style="font-size: 1.4rem; color: #6366f1;">${name}</strong>`;
            }

            clear() {
                document.getElementById('user-input').value = '';
                document.getElementById('pass-input').value = '';
                document.getElementById('user-input').focus();
            }
        }
        const authApp = new AuthSystem();
    </script>
</body>
</html>
