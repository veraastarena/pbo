<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAS PBO - Aplikasi Login</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }
        h2 { margin-bottom: 25px; color: #333; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }
        [cite_start]/* Tombol sesuai instruksi UX UAS [cite: 33, 34] */
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .btn-login { background-color: #007bff; color: white; } /* Biru Positif */
        .btn-logout { background-color: #dc3545; color: white; } /* Merah */
        .btn-cancel { background-color: #ffcc00; color: black; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="login-box">
        <div id="view-login">
            <h2>Login</h2>
            <input type="text" id="user-field" placeholder="Username (Contoh: vera)">
            <input type="password" id="pass-field" placeholder="Password">
            <button class="btn btn-login" onclick="appAuth.prosesLogin()">Log In</button>
            <button class="btn btn-cancel" onclick="appAuth.bersihkanForm()">Cancel</button>
        </div>

        <div id="view-profile" class="hidden">
            <h2>Halaman Profil</h2>
            <p id="msg-profile" style="font-weight: bold; color: #007bff;"></p>
            <button class="btn btn-logout" onclick="appAuth.prosesLogout()">Log Out</button>
        </div>
    </div>

    <script>
        /**
         * [cite_start]Implementasi OOP sesuai Soal UAS [cite: 23, 24]
         */
        class LoginSystem {
            constructor() {
                this.sessionKey = 'status_login';
                this.dbKey = 'database_user';
                this.initData(); // Menyiapkan data di LocalStorage
                this.checkSession();
            }

            [cite_start]// Inisialisasi data ke LocalStorage sesuai soal [cite: 18, 19]
            initData() {
                const dataAwal = [
                    { nama: "vera", sandi: "vera123" },
                    { nama: "asta", sandi: "asta456" }
                ];
                if (!localStorage.getItem(this.dbKey)) {
                    localStorage.setItem(this.dbKey, JSON.stringify(dataAwal));
                }
            }

            prosesLogin() {
                const u = document.getElementById('user-field').value.toLowerCase();
                const p = document.getElementById('pass-field').value;
                
                [cite_start]// Mengambil data dari LocalStorage (Simulasi File I/O) [cite: 18]
                const listUser = JSON.parse(localStorage.getItem(this.dbKey));
                const ditemukan = listUser.find(user => user.nama === u && user.sandi === p);

                if (ditemukan) {
                    localStorage.setItem(this.sessionKey, JSON.stringify(ditemukan));
                    this.tampilkanHalamanProfil(ditemukan.nama);
                } else {
                    alert("mohon maaf, kamu gagal login."); [cite_start]// Sesuai instruksi soal [cite: 38]
                }
            }

            prosesLogout() {
                localStorage.removeItem(this.sessionKey); [cite_start]// Menghapus session [cite: 44]
                location.reload(); 
            }

            checkSession() {
                const session = localStorage.getItem(this.sessionKey);
                if (session) {
                    const user = JSON.parse(session);
                    this.tampilkanHalamanProfil(user.nama);
                }
            }

            tampilkanHalamanProfil(username) {
                document.getElementById('view-login').classList.add('hidden');
                document.getElementById('view-profile').classList.remove('hidden');
                document.getElementById('msg-profile').innerText = `Selamat Datang, ${username}!`;
            }

            bersihkanForm() {
                document.getElementById('user-field').value = '';
                document.getElementById('pass-field').value = '';
            }
        }

        [cite_start]// Membuat Object dari Class [cite: 28]
        const appAuth = new LoginSystem();
    </script>
</body>
</html>
