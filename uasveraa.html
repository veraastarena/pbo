<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAS PBO - Secure Auth System</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --danger: #ef4444;
            --bg-dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(239, 68, 68, 0.1) 0%, transparent 50%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
        }

        /* Dekorasi Latar Belakang */
        .grid-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .container:hover {
            border-color: rgba(99, 102, 241, 0.3);
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin: 0;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 0.875rem;
            color: var(--text-dim);
            margin-top: 0.5rem;
        }

        /* Input Styling */
        .input-group {
            margin-bottom: 1.25rem;
            position: relative;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.2s;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            background: rgba(0, 0, 0, 0.4);
        }

        /* Button Styling */
        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-login {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-login:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-cancel {
            background: transparent;
            color: var(--text-dim);
            border: 1px solid var(--glass-border);
        }

        .btn-cancel:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border-color: var(--danger);
        }

        .btn-logout {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid var(--glass-border);
        }

        .btn-logout:hover {
            background: var(--danger);
            border-color: var(--danger);
        }

        #profile-info {
            background: rgba(99, 102, 241, 0.1);
            padding: 1.5rem;
            border-radius: 16px;
            margin-bottom: 2rem;
            border-left: 4px solid var(--primary);
            font-size: 1.1rem;
        }

        .hidden { display: none; }

        /* Small Decoration Tags */
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            margin-bottom: 1rem;
            text-transform: uppercase;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>

    <div class="container">
        <div id="login-view">
            <header>
                <span class="badge">UAS PBO System v2.0</span>
                <h2>Sistem Autentikasi</h2>
                <p class="subtitle">Silahkan masukkan kredensial Anda</p>
            </header>
            
            <div class="input-group">
                <input type="text" id="user-input" placeholder="Username" autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" id="pass-input" placeholder="Password">
            </div>
            
            <button class="btn btn-login" onclick="authApp.login()">
                Masuk ke Sistem
            </button>
            <button class="btn btn-cancel" onclick="authApp.clear()">
                Reset Form
            </button>
        </div>

        <div id="profile-view" class="hidden">
            <header>
                <span class="badge" style="background: rgba(34, 197, 94, 0.2); color: #86efac;">Sesi Aktif</span>
                <h2>Profil Pengguna</h2>
            </header>
            <div id="profile-info"></div>
            <button class="btn btn-logout" onclick="authApp.logout()">Keluar Sesi</button>
        </div>
    </div>

    <script>
        /* LOGIC TETAP SAMA SESUAI ASLINYA */
        class AuthSystem {
            constructor() {
                this.sessionKey = 'user_session';
                const storedUsers = localStorage.getItem('database_pengguna');
                
                this.users = storedUsers ? JSON.parse(storedUsers) : [
                    { nama: "vera", sandi: "vera123" },
                    { nama: "asta", sandi: "asta456" },
                    { nama: "rena", sandi: "rena789" }
                ];
                this.checkSession();
            }

            login() {
                const uInput = document.getElementById('user-input').value.trim();
                const pInput = document.getElementById('pass-input').value;

                const user = this.users.find(x => x.nama.toLowerCase() === uInput.toLowerCase() && x.sandi === pInput);

                if (user) {
                    alert(Hi, ${user.nama} selamat anda berhasil login.);
                    localStorage.setItem(this.sessionKey, JSON.stringify(user));
                    this.showDashboard(user.nama);
                } else {
                    const displayName = uInput ? uInput : "User";
                    alert(Mohon maaf ${displayName} anda gagal login.);
                }
            }

            logout() {
                localStorage.removeItem(this.sessionKey);
                location.reload();
            }

            checkSession() {
                const session = localStorage.getItem(this.sessionKey);
                if (session) {
                    const userData = JSON.parse(session);
                    this.showDashboard(userData.nama);
                }
            }

            showDashboard(name) {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('profile-view').classList.remove('hidden');
                document.getElementById('profile-info').innerText = Selamat Datang kembali, ${name};
            }

            clear() {
                document.getElementById('user-input').value = '';
                document.getElementById('pass-input').value = '';
                document.getElementById('user-input').focus();
            }
        }

        const authApp = new AuthSystem();
    </script>
</body>
</html>
