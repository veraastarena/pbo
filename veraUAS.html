<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Login OOP - Ultra Glass Edition</title>
    <style>
        :root {
            --primary-cyan: #00f2ff;
            --secondary-yellow: #ffcc00;
            --dark-bg: #0a192f;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: var(--dark-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
            overflow: hidden;
            position: relative;
        }

        /* --- BACKGROUND DECORATION (FOR BLUR EFFECT) --- */
        /* Lingkaran cahaya di belakang agar efek blur kaca terlihat nyata */
        .bg-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 242, 255, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 1;
            filter: blur(50px);
        }
        .glow-1 { top: 10%; left: 20%; }
        .glow-2 { bottom: 10%; right: 20%; background: radial-gradient(circle, rgba(255, 204, 0, 0.1) 0%, transparent 70%); }

        /* Grid Sirkuit */
        .circuit-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle at 2px 2px, rgba(0, 242, 255, 0.05) 1px, transparent 0);
            background-size: 50px 50px;
            z-index: 2;
        }

        /* --- LOGIN BOX (GLASSMORPHISM) --- */
        .login-box {
            position: relative;
            z-index: 10; /* Pastikan di atas background */
            background: rgba(255, 255, 255, 0.05); /* Transparan tipis */
            backdrop-filter: blur(25px); /* EFEK BLUR UTAMA */
            -webkit-backdrop-filter: blur(25px);
            padding: 50px 40px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            width: 380px;
            text-align: center;
        }

        h2 { 
            margin-bottom: 5px; 
            font-size: 2em;
            letter-spacing: 1px;
            text-shadow: 0 0 15px var(--primary-cyan);
        }

        .subtitle {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 35px;
            display: block;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 242, 255, 0.3);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: 0.4s;
            margin-bottom: 20px;
        }

        input:focus {
            border-color: var(--primary-cyan);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            background: rgba(0, 0, 0, 0.6);
        }

        /* --- BUTTONS --- */
        .btn-custom {
            width: 100%;
            padding: 14px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%);
            transition: 0.3s;
            display: block;
            letter-spacing: 1px;
        }

        .btn-login {
            background-color: #000;
            color: white;
            border-left: 4px solid var(--primary-cyan);
        }

        .btn-cancel {
            background-color: var(--secondary-yellow);
            color: black;
        }

        .btn-custom:hover {
            transform: translateY(-3px);
            filter: brightness(1.2);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .hidden { display: none; }

        #msg-success { 
            color: var(--primary-cyan); 
            border: 1px solid var(--primary-cyan);
            padding: 20px;
            border-radius: 12px;
            background: rgba(0, 242, 255, 0.1);
            line-height: 1.6;
        }

        /* Hiasan Sudut */
        .corner {
            position: absolute;
            width: 25px;
            height: 25px;
            border: 2px solid var(--primary-cyan);
            opacity: 0.5;
        }
        .tl { top: 15px; left: 15px; border-right: none; border-bottom: none; }
        .br { bottom: 15px; right: 15px; border-left: none; border-top: none; }
    </style>
</head>
<body>

    <div class="circuit-overlay"></div>
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <div class="login-box">
        <div class="corner tl"></div>
        <div class="corner br"></div>

        <div id="view-login">
            <h2>LOGIN SYSTEM</h2>
            <span class="subtitle">Future OOP Authentication</span>
            
            <input type="text" id="user-field" placeholder="Username (Vera/Asta/Rena)">
            <input type="password" id="pass-field" placeholder="Password">
            
            <button class="btn-custom btn-login" onclick="db_user.prosesLogin()">ACCESS SYSTEM</button>
            <button class="btn-custom btn-cancel" onclick="db_user.bersihkanForm()">RESET</button>
        </div>

        <div id="view-dashboard" class="hidden">
            <p id="msg-success"></p>
            <button class="btn-custom btn-login" style="margin-top: 20px;" onclick="location.reload()">LOGOUT</button>
        </div>
    </div>

    <script>
        const AppAuth = class {
            constructor() {
                this.storageKey = 'database_pengguna';
                this.dataAwal = [
                    { nama: "vera", sandi: "vera123" },
                    { nama: "asta", sandi: "asta456" },
                    { nama: "rena", sandi: "rena789" }
                ];
                this.init();
            }

            init() {
                if (!localStorage.getItem(this.storageKey)) {
                    localStorage.setItem(this.storageKey, JSON.stringify(this.dataAwal));
                }
            }

            prosesLogin() {
                const u = document.getElementById('user-field').value;
                const p = document.getElementById('pass-field').value;
                const listUser = JSON.parse(localStorage.getItem(this.storageKey));
                
                const userKetemu = listUser.find(item => item.nama.toLowerCase() === u.toLowerCase());

                if (userKetemu && userKetemu.sandi === p) {
                    document.getElementById('view-login').classList.add('hidden');
                    document.getElementById('view-dashboard').classList.remove('hidden');
                    document.getElementById('msg-success').innerHTML = `<strong>ACCESS GRANTED</strong><br>Welcome back, Agent ${userKetemu.nama.toUpperCase()}. System is now ready.`;
                } else {
                    alert(`ACCESS DENIED! Invalid credentials.`);
                }
            }

            bersihkanForm() {
                document.getElementById('user-field').value = '';
                document.getElementById('pass-field').value = '';
            }
        };

        const db_user = new AppAuth();

        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') db_user.prosesLogin();
        });
    </script>
</body>
</html>
