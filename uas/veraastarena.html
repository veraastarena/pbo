<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Aplikasi Login OOP - Fix Tampilan</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 320px;
            text-align: center;
        }
        h2 { margin-bottom: 25px; color: #333; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        /* PERMINTAAN UX: WARNA TOMBOL */
        .btn-login {
            background-color: #000000; /* HITAM */
            color: #ffffff;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .btn-cancel {
            background-color: #ffcc00; /* KUNING */
            color: #000000;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-login:hover, .btn-cancel:hover { opacity: 0.8; }
        .hidden { display: none; }
        #msg-success { color: #28a745; font-weight: bold; font-size: 1.1em; }
    </style>
</head>
<body>

    <div class="login-box">
        <div id="view-login">
            <h2>Login</h2>
            <input type="text" id="user-field" placeholder="Username (Contoh: Vera)">
            <input type="password" id="pass-field" placeholder="Password">
            
            <button class="btn-login" onclick="db_user.prosesLogin()">Log In</button>
            <button class="btn-cancel" onclick="db_user.bersihkanForm()">Cancel</button>
        </div>

        <div id="view-dashboard" class="hidden">
            <p id="msg-success"></p>
            <button class="btn-login" style="margin-top: 20px;" onclick="location.reload()">Log Out</button>
        </div>
    </div>

    <script>
        /**
         * Menggunakan Konsep Pemrograman Berbasis Objek (OOP)
         * Objek 'db_user' mengelola data dan logika
         */
        const AppAuth = class {
            constructor() {
                this.storageKey = 'database_pengguna';
                this.dataAwal = [
                    { nama: "vera", sandi: "vera123" },
                    { nama: "asta", sandi: "asta456" },
                    { nama: "rena", sandi: "rena789" }
                ];
                this.init();
            }

            // Simpan JSON ke Local Storage jika belum ada
            init() {
                if (!localStorage.getItem(this.storageKey)) {
                    localStorage.setItem(this.storageKey, JSON.stringify(this.dataAwal));
                }
            }

            prosesLogin() {
                const u = document.getElementById('user-field').value;
                const p = document.getElementById('pass-field').value;
                
                // Ambil data dari Local Storage
                const listUser = JSON.parse(localStorage.getItem(this.storageKey));
                
                // Cari user
                const userKetemu = listUser.find(item => item.nama.toLowerCase() === u.toLowerCase());

                if (userKetemu && userKetemu.sandi === p) {
                    // JIKA BERHASIL
                    document.getElementById('view-login').classList.add('hidden');
                    document.getElementById('view-dashboard').classList.remove('hidden');
                    document.getElementById('msg-success').innerText = `Hi: ${userKetemu.nama} anda berhasil log in, selamat.`;
                } else {
                    // JIKA GAGAL
                    const namaTampil = u ? u : "pengunjung";
                    alert(`mohon maaf ${namaTampil}, kamu gagal login.`);
                }
            }

            bersihkanForm() {
                document.getElementById('user-field').value = '';
                document.getElementById('pass-field').value = '';
            }
        };

        // Inisialisasi Objek db_user sesuai permintaan
        const db_user = new AppAuth();
    </script>
</body>
</html>
