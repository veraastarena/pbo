<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Login PBO - LocalStorage</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #333; margin-bottom: 1.5rem; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 5px; outline: none; }
        input:focus { border-color: #007bff; }
        button { width: 100%; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; margin-top: 10px; }
        .btn-login { background-color: #007bff; color: white; }
        .btn-login:hover { background-color: #0056b3; }
        .btn-logout { background-color: #dc3545; color: white; }
        .hidden { display: none; }
        .welcome-text { font-size: 1.5rem; color: #2c3e50; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-view">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button class="btn-login" onclick="app.handleLogin()">Masuk</button>
        <p style="font-size: 0.8rem; color: #777; margin-top: 10px;">
            User: admin (123), budi (abc), siti (rahasia)
        </p>
    </div>

    <div id="user-view" class="hidden">
        <div class="welcome-text" id="display-name"></div>
        <p>Anda berhasil login menggunakan sistem berbasis objek dan JSON storage.</p>
        <button class="btn-logout" onclick="app.handleLogout()">Keluar</button>
    </div>
</div>

<script>
    // 1. Model: Blueprint Data User
    class User {
        constructor(username, password, name) {
            this.username = username;
            this.password = password;
            this.name = name;
        }
    }

    // 2. Controller: Engine Aplikasi
    class AuthApp {
        constructor() {
            this.storageKey = 'my_app_users';
            this.currentUser = null;
            this.initDB();
        }

        // Inisialisasi Database JSON di Local Storage
        initDB() {
            if (!localStorage.getItem(this.storageKey)) {
                const initialUsers = [
                    new User('admin', '123', 'Administrator Utama'),
                    new User('budi', 'abc', 'Budi Santoso'),
                    new User('siti', 'rahasia', 'Siti Aminah')
                ];
                // Simpan ke Local Storage sebagai JSON string
                localStorage.setItem(this.storageKey, JSON.stringify(initialUsers));
            }
        }

        // Logika Autentikasi
        handleLogin() {
            const userIn = document.getElementById('username').value;
            const passIn = document.getElementById('password').value;

            // Ambil data dari JSON dan parse kembali ke Array
            const users = JSON.parse(localStorage.getItem(this.storageKey));
            
            // Cari kecocokan data
            const found = users.find(u => u.username === userIn && u.password === passIn);

            if (found) {
                this.currentUser = found;
                this.renderUI('user');
            } else {
                alert("Gagal Login: Username atau password salah!");
            }
        }

        handleLogout() {
            this.currentUser = null;
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            this.renderUI('login');
        }

        // Manajemen Tampilan (UI)
        renderUI(view) {
            const loginView = document.getElementById('login-view');
            const userView = document.getElementById('user-view');
            const displayName = document.getElementById('display-name');

            if (view === 'user') {
                loginView.classList.add('hidden');
                userView.classList.remove('hidden');
                displayName.innerText = `Hi: ${this.currentUser.name}`;
            } else {
                loginView.classList.remove('hidden');
                userView.classList.add('hidden');
            }
        }
    }

    // Instansiasi Objek Utama
    const app = new AuthApp();
</script>

</body>
</html>
