<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Login OOP - Future Edition</title>
    <style>
        :root {
            --primary-cyan: #00f2ff;
            --secondary-yellow: #ffcc00;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --dark-bg: #0a192f;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: var(--dark-bg);
            /* Background pola sirkuit futuristik */
            background-image: 
                radial-gradient(circle at 2px 2px, rgba(0, 242, 255, 0.15) 1px, transparent 0);
            background-size: 40px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
            overflow: hidden;
        }

        /* Glassmorphism Container */
        .login-box {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 50px 40px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), 
                        inset 0 0 15px rgba(0, 242, 255, 0.1);
            width: 380px;
            text-align: center;
            position: relative;
        }

        h2 { 
            margin-bottom: 5px; 
            font-size: 2.2em;
            letter-spacing: 1px;
            text-shadow: 0 0 10px var(--primary-cyan);
        }

        .subtitle {
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 30px;
            display: block;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--primary-cyan);
            border-radius: 4px;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
            background: rgba(0, 0, 0, 0.5);
        }

        /* Desain Tombol Futuristik */
        .btn-container {
            margin-top: 30px;
        }

        .btn-custom {
            width: 100%;
            padding: 12px;
            border: none;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            margin-bottom: 15px;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
            transition: 0.3s;
            display: block;
        }

        .btn-login {
            background-color: #000;
            color: white;
            border-left: 5px solid var(--primary-cyan);
        }

        .btn-cancel {
            background-color: var(--secondary-yellow);
            color: black;
            border-right: 5px solid #fff;
        }

        .btn-custom:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }

        .hidden { display: none; }

        #msg-success { 
            color: var(--primary-cyan); 
            font-weight: bold; 
            font-size: 1.2em;
            border: 1px solid var(--primary-cyan);
            padding: 15px;
            border-radius: 8px;
            background: rgba(0, 242, 255, 0.05);
        }

        /* Dekorasi tambahan */
        .corner-decor {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--primary-cyan);
        }
        .top-left { top: 10px; left: 10px; border-right: none; border-bottom: none; }
        .bottom-right { bottom: 10px; right: 10px; border-left: none; border-top: none; }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="corner-decor top-left"></div>
        <div class="corner-decor bottom-right"></div>

        <div id="view-login">
            <h2>Aplikasi Login OOP</h2>
            <span class="subtitle">Secure. Modular. Elegant.</span>
            
            <div class="input-group">
                <input type="text" id="user-field" placeholder="Username (Contoh: Vera)">
            </div>
            <div class="input-group">
                <input type="password" id="pass-field" placeholder="Password">
            </div>
            
            <div class="btn-container">
                <button class="btn-custom btn-login" onclick="db_user.prosesLogin()">Log In</button>
                <button class="btn-custom btn-cancel" onclick="db_user.bersihkanForm()">Cancel</button>
            </div>
        </div>

        <div id="view-dashboard" class="hidden">
            <p id="msg-success"></p>
            <button class="btn-custom btn-login" style="margin-top: 20px;" onclick="location.reload()">Log Out</button>
        </div>
    </div>

    <script>
        /**
         * Menggunakan Konsep Pemrograman Berbasis Objek (OOP)
         */
        const AppAuth = class {
            constructor() {
                this.storageKey = 'database_pengguna';
                this.dataAwal = [
                    { nama: "vera", sandi: "vera123" },
                    { nama: "asta", sandi: "asta456" },
                    { nama: "rena", sandi: "rena789" }
                ];
                this.init();
            }

            init() {
                if (!localStorage.getItem(this.storageKey)) {
                    localStorage.setItem(this.storageKey, JSON.stringify(this.dataAwal));
                }
            }

            prosesLogin() {
                const u = document.getElementById('user-field').value;
                const p = document.getElementById('pass-field').value;
                const listUser = JSON.parse(localStorage.getItem(this.storageKey));
                
                const userKetemu = listUser.find(item => item.nama.toLowerCase() === u.toLowerCase());

                if (userKetemu && userKetemu.sandi === p) {
                    document.getElementById('view-login').classList.add('hidden');
                    document.getElementById('view-dashboard').classList.remove('hidden');
                    document.getElementById('msg-success').innerText = `Hi: ${userKetemu.nama}, anda berhasil login ke sistem.`;
                } else {
                    const namaTampil = u ? u : "pengunjung";
                    alert(`Maaf ${namaTampil}, akses ditolak. Periksa kembali password Anda.`);
                }
            }

            bersihkanForm() {
                document.getElementById('user-field').value = '';
                document.getElementById('pass-field').value = '';
            }
        };

        const db_user = new AppAuth();

        // Fitur Enter untuk Login (Opsional tapi disukai dosen)
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') db_user.prosesLogin();
        });
    </script>
</body>
</html>
