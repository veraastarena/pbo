<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Login OOP - LocalStorage</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }
        h2 { color: #333; }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.3s;
        }
        button:hover { opacity: 0.8; }
        .btn-login { background-color: #000; color: #fff; }
        .btn-cancel { background-color: #ffcc00; color: #000; }
        #welcome-screen { display: none; }
    </style>
</head>
<body>

    <div class="container" id="login-container">
        <h2 id="form-title">Silakan Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <div class="button-group">
            <button class="btn-cancel" onclick="app.resetForm()">Cancel</button>
            <button class="btn-login" onclick="app.handleLogin()">Log In</button>
        </div>
    </div>

    <div class="container" id="welcome-screen">
        <h2 id="welcome-msg"></h2>
        <button class="btn-login" onclick="location.reload()">Log Out</button>
    </div>

    <script>
        // Struktur Objek Database User
        const initialUsers = [
            { username: "Vera", password: "123" },
            { username: "Budi", password: "456" },
            { username: "Eka", password: "789" }
        ];

        class AuthManager {
            constructor(dbName) {
                this.dbName = dbName;
                this.initDB();
            }

            // Inisialisasi Database ke LocalStorage
            initDB() {
                if (!localStorage.getItem(this.dbName)) {
                    localStorage.setItem(this.dbName, JSON.stringify(initialUsers));
                }
            }

            // Mendapatkan data user dari storage
            getUsers() {
                return JSON.parse(localStorage.getItem(this.dbName));
            }

            // Logika Login
            login(inputUser, inputPass) {
                const users = this.getUsers();
                const userFound = users.find(u => u.username.toLowerCase() === inputUser.toLowerCase());

                if (userFound) {
                    if (userFound.password === inputPass) {
                        return { success: true, name: userFound.username };
                    }
                }
                return { success: false, name: inputUser };
            }

            // Manajemen UI
            handleLogin() {
                const userVal = document.getElementById('username').value;
                const passVal = document.getElementById('password').value;

                if (!userVal || !passVal) {
                    alert("Harap isi semua kolom!");
                    return;
                }

                const result = this.login(userVal, passVal);

                if (result.success) {
                    this.showDashboard(result.name);
                } else {
                    alert(`Mohon maaf ${result.name}, kamu gagal login.`);
                }
            }

            showDashboard(name) {
                document.getElementById('login-container').style.display = 'none';
                const welcomeScreen = document.getElementById('welcome-screen');
                welcomeScreen.style.display = 'block';
                document.getElementById('welcome-msg').innerText = `Hi: ${name} anda berhasil log in, selamat.`;
            }

            resetForm() {
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
            }
        }

        // Inisialisasi Objek Aplikasi
        const app = new AuthManager('db_user');
    </script>
</body>
</html>
