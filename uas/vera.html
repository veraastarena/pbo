<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login System OOP</title>
    <style>
        /* CSS untuk Styling dan UX */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        h2 { margin-bottom: 1.5rem; color: #333; }

        .input-group { margin-bottom: 1rem; text-align: left; }
        
        label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: #666; }
        
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box; /* Agar padding tidak merusak lebar */
            font-size: 1rem;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 1.5rem;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.8; }

        /* Request UX: Warna Spesifik */
        .btn-cancel {
            background-color: #FFD700; /* Kuning */
            color: #333;
        }

        .btn-login {
            background-color: #000000; /* Hitam */
            color: #ffffff;
        }

        .hidden { display: none; }
        
        #user-info {
            font-size: 1.2rem;
            color: #2c3e50;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="card">
        
        <div id="login-view">
            <h2>Silakan Login</h2>
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Masukkan username">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan password">
            </div>
            <div class="btn-group">
                <button id="btn-cancel" class="btn-cancel">Cancel</button>
                <button id="btn-login" class="btn-login">Log In</button>
            </div>
        </div>

        <div id="dashboard-view" class="hidden">
            <h2 style="color: green;">Login Sukses!</h2>
            <p id="user-info"></p>
            <div class="btn-group">
                <button onclick="location.reload()" class="btn-cancel">Log Out</button>
            </div>
        </div>

    </div>

    <script>
        /**
         * CLASS: AuthSystem
         * Menerapkan prinsip OOP untuk enkapsulasi logika login dan database
         */
        class AuthSystem {
            constructor() {
                // Nama key untuk local storage
                this.dbKey = 'db_user';
                
                // Data awal 3 user
                this.initialData = [
                    { username: 'vera', password: 'vera123' },
                    { username: 'asta', password: 'asta456' },
                    { username: 'rena', password: 'rena789' }
                ];

                // Menjalankan fungsi inisialisasi
                this.initDatabase();
                this.initEventListeners();
            }

            // 1. Setup Database (LocalStorage)
            initDatabase() {
                // Cek apakah database sudah ada, jika belum, buat baru
                if (!localStorage.getItem(this.dbKey)) {
                    localStorage.setItem(this.dbKey, JSON.stringify(this.initialData));
                    console.log('Database diinisialisasi.');
                }
            }

            // 2. Mengambil Data User (Getter)
            getUsers() {
                const data = localStorage.getItem(this.dbKey);
                return JSON.parse(data); // Mengubah JSON string menjadi Objek JS
            }

            // 3. Logika Validasi Login
            attemptLogin(inputName, inputPass) {
                const users = this.getUsers();
                
                // Mencari user yang cocok (case insensitive untuk username)
                const foundUser = users.find(user => 
                    user.username.toLowerCase() === inputName.toLowerCase() && 
                    user.password === inputPass
                );

                if (foundUser) {
                    this.renderSuccess(foundUser.username);
                } else {
                    this.renderFail(inputName);
                }
            }

            // 4. Menangani Tampilan Sukses
            renderSuccess(name) {
                const loginView = document.getElementById('login-view');
                const dashboardView = document.getElementById('dashboard-view');
                const userInfo = document.getElementById('user-info');

                // Sembunyikan login, tampilkan dashboard
                loginView.classList.add('hidden');
                dashboardView.classList.remove('hidden');

                // Pesan sesuai request
                userInfo.textContent = `Hi: ${name} anda berhasil log in, selamat.`;
            }

            // 5. Menangani Tampilan Gagal
            renderFail(name) {
                // Jika input kosong, beri nama default untuk pesan error
                const displayName = name.trim() === "" ? "User" : name;
                
                // Alert sesuai request
                alert(`Mohon maaf ${displayName}, kamu gagal login.`);
            }

            // 6. Reset Form (Tombol Cancel)
            resetForm() {
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
                document.getElementById('username').focus();
            }

            // 7. Binding Event Listeners (Menghubungkan HTML dengan Class ini)
            initEventListeners() {
                const btnLogin = document.getElementById('btn-login');
                const btnCancel = document.getElementById('btn-cancel');

                btnLogin.addEventListener('click', () => {
                    const userVal = document.getElementById('username').value;
                    const passVal = document.getElementById('password').value;
                    this.attemptLogin(userVal, passVal);
                });

                btnCancel.addEventListener('click', () => {
                    this.resetForm();
                });
            }
        }

        // Inisialisasi Aplikasi ketika halaman dimuat
        document.addEventListener('DOMContentLoaded', () => {
            const app = new AuthSystem();
        });

    </script>
</body>
</html>
