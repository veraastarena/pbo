<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Login OOP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        /* PERMINTAAN KHUSUS WARNA */
        .btn-login {
            background-color: #000000; /* HITAM */
            color: white;
            flex: 2;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-cancel {
            background-color: #ffcc00; /* KUNING */
            color: black;
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card" id="app-container">
        <div id="login-form">
            <h2>Login</h2>
            <input type="text" id="username" placeholder="Username (Vera/Andi/Budi)">
            <input type="password" id="password" placeholder="Password">
            <div class="btn-group">
                <button class="btn-cancel" onclick="auth.reset()">Cancel</button>
                <button class="btn-login" onclick="auth.handleLogin()">Log In</button>
            </div>
        </div>

        <div id="welcome-screen" class="hidden">
            <h3 id="welcome-text"></h3>
            <button class="btn-login" onclick="location.reload()">Log Out</button>
        </div>
    </div>

    <script>
        // Data awal untuk LocalStorage
        const db_user = [
            { user: "vera", pass: "vera123" },
            { user: "asta", pass: "asta456" },
            { user: "rena", pass: "rena789" }
        ];

        // Definisi Class (OOP)
        class Authenticator {
            constructor(storageKey, initialData) {
                this.key = storageKey;
                // Simpan ke LocalStorage jika belum ada
                if (!localStorage.getItem(this.key)) {
                    localStorage.setItem(this.key, JSON.stringify(initialData));
                }
            }

            getData() {
                return JSON.parse(localStorage.getItem(this.key));
            }

            handleLogin() {
                const uInput = document.getElementById('username').value;
                const pInput = document.getElementById('password').value;
                const users = this.getData();

                // Cari user di dalam data JSON
                const found = users.find(item => item.user.toLowerCase() === uInput.toLowerCase());

                if (found && found.pass === pInput) {
                    // Berhasil
                    document.getElementById('login-form').classList.add('hidden');
                    document.getElementById('welcome-screen').classList.remove('hidden');
                    document.getElementById('welcome-text').innerText = `Hi: ${found.user} anda berhasil log in, selamat.`;
                } else {
                    // Gagal
                    alert(`mohon maaf ${uInput || 'user'}, kamu gagal login.`);
                }
            }

            reset() {
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
            }
        }

        // Inisialisasi Objek
        const auth = new Authenticator('db_user', db_user);
    </script>
</body>
</html>
