<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login & Daftar - OOP Local Storage</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #7b2ff7, #f107a3);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            width: 340px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
        }

        button {
            padding: 12px;
            width: 48%;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            border: none;
        }

        .btn-login {
            background: #7b2ff7;
            color: white;
        }

        .btn-login:hover {
            background: #6923d4;
        }

        .btn-cancel {
            background: #e74c3c;
            color: white;
        }

        .btn-cancel:hover {
            background: #c0392b;
        }

        .link {
            margin-top: 15px;
            font-size: 14px;
            color: #7b2ff7;
            cursor: pointer;
        }

        .success {
            color: #2ecc71;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<!-- LOGIN -->
<div class="card" id="loginPage">
    <h2>Login</h2>
    <input type="text" id="loginUser" placeholder="Username">
    <input type="password" id="loginPass" placeholder="Password">

    <div class="btn-group">
        <button class="btn-login" onclick="app.login()">Login</button>
        <button class="btn-cancel" onclick="app.resetLogin()">Cancel</button>
    </div>

    <div class="link" onclick="app.showRegister()">Belum punya akun? Daftar</div>
</div>

<!-- REGISTER -->
<div class="card" id="registerPage" style="display:none;">
    <h2>Daftar Akun</h2>
    <input type="text" id="regUser" placeholder="Username">
    <input type="text" id="regName" placeholder="Nama Lengkap">
    <input type="password" id="regPass" placeholder="Password">

    <div class="btn-group">
        <button class="btn-login" onclick="app.register()">Daftar</button>
        <button class="btn-cancel" onclick="app.showLogin()">Batal</button>
    </div>

    <div id="regInfo"></div>
</div>

<!-- USER PAGE -->
<div class="card" id="userPage" style="display:none;">
    <h2 id="welcome"></h2>
    <button class="btn-login" onclick="app.logout()">Logout</button>
</div>

<script>
/* ======================
   DATABASE USER (OOP)
====================== */
class DatabaseUser {
    constructor() {
        this.key = "db_user";
        this.init();
    }

    init() {
        if (!localStorage.getItem(this.key)) {
            const users = [
                { username: "vera", password: "123", fullname: "Vera Astarena" },
                { username: "admin", password: "admin123", fullname: "Admin Sistem" },
                { username: "user", password: "user123", fullname: "User Umum" }
            ];
            localStorage.setItem(this.key, JSON.stringify(users));
        }
    }

    getUsers() {
        return JSON.parse(localStorage.getItem(this.key));
    }

    saveUsers(users) {
        localStorage.setItem(this.key, JSON.stringify(users));
    }
}

/* ======================
   APLIKASI UTAMA (OOP)
====================== */
class App {
    constructor() {
        this.db = new DatabaseUser();
    }

    showRegister() {
        this.toggle("registerPage");
    }

    showLogin() {
        this.toggle("loginPage");
    }

    toggle(pageId) {
        ["loginPage", "registerPage", "userPage"].forEach(id => {
            document.getElementById(id).style.display =
                id === pageId ? "block" : "none";
        });
    }

    login() {
        const u = loginUser.value;
        const p = loginPass.value;

        const users = this.db.getUsers();
        const user = users.find(x => x.username === u && x.password === p);

        if (user) {
            this.toggle("userPage");
            welcome.innerText = `Hi ${user.fullname}, kamu berhasil login`;
        } else {
            alert("❌ Login gagal!");
        }
    }

    register() {
        const u = regUser.value;
        const n = regName.value;
        const p = regPass.value;

        if (!u || !n || !p) {
            regInfo.innerHTML = "<p style='color:red'>Semua field wajib diisi!</p>";
            return;
        }

        const users = this.db.getUsers();
        if (users.some(x => x.username === u)) {
            regInfo.innerHTML = "<p style='color:red'>Username sudah terdaftar!</p>";
            return;
        }

        users.push({ username: u, password: p, fullname: n });
        this.db.saveUsers(users);

        regInfo.innerHTML = "<p class='success'>Akun berhasil dibuat ✔</p>";
        setTimeout(() => this.showLogin(), 1500);
    }

    resetLogin() {
        loginUser.value = "";
        loginPass.value = "";
    }

    logout() {
        this.toggle("loginPage");
        this.resetLogin();
    }
}

/* ======================
   INISIALISASI
====================== */
const app = new App();
</script>

</body>
</html>
